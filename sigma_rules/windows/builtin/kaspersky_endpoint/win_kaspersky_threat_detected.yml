title: Kaspersky Endpoint Security Detected An Active Threat
id: 9a7c8d2e-4b1a-6c3d-bf5e-8d0f3e4f5061
status: stable
description: |
    Kaspersky Endpoint Security (provider "avp") emitted an event indicating
    an actively executing or freshly-blocked threat: malicious object,
    exploit, or vulnerability identified through the System Watcher /
    behavioral engine. These EventIDs reflect operator-relevant detections,
    not just routine scan completions. Each hit is worth investigating with
    the corresponding host's process / file telemetry from around the same
    timestamp because the AV verdict is the ground truth that something
    landed on the endpoint.
references:
    - https://support.kaspersky.com/KESWin/12.0/en-US/175970.htm
    - https://support.kaspersky.com/help/KESWin/12.0/ru-RU/175970.htm
author: Corax Security
date: 2026-05-05
tags:
    - attack.execution
    - attack.defense-evasion
logsource:
    product: windows
    service: kaspersky_endpoint
    definition: 'Channel = "Kaspersky Endpoint Security" (Provider avp)'
detection:
    selection:
        Provider_Name: 'avp'
        EventID:
            - 201   # Object infected
            - 211   # Application is being launched (suspicious)
            - 302   # Suspicious activity
            - 317   # Exploit prevented
            - 231   # Vulnerability detected
    condition: selection
falsepositives:
    - Penetration tests where the operator triggered AV intentionally.
level: high
